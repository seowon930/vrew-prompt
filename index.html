<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="질문에 답하면 브루용 캐릭터·대본·이미지 프롬프트를 만들어 주는 연수용 도우미">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>숏폼 프롬프트 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 단계 탭 + 왼쪽은 질문-답 대화, 오른쪽은 실시간으로 채워지는 프롬프트 패널 (휴대폰은 위아래) */
:root {
  --paper: #F2F6F4; --surface: #FFFFFF; --sunk: #E8EFEC; --ink: #15201C; --muted: #55665F; --line: #D3DED9;
  --accent: #0B7A69; --accent-ink: #FFFFFF; --accent-soft: #DCF0E9;
  --clip: #E3A02C; --clip-soft: #FBEACB; --clip-ink: #5A3C04;
  --display: 'Do Hyeon', 'IBM Plex Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1513; --surface: #18201D; --sunk: #121A17; --ink: #E2EBE7; --muted: #94A69F; --line: #2A3632;
    --accent: #3CC1A7; --accent-ink: #062520; --accent-soft: #15302A;
    --clip: #F0B54A; --clip-soft: #3A2D12; --clip-ink: #F6DCA4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1513; --surface: #18201D; --sunk: #121A17; --ink: #E2EBE7; --muted: #94A69F; --line: #2A3632;
  --accent: #3CC1A7; --accent-ink: #062520; --accent-soft: #15302A;
  --clip: #F0B54A; --clip-soft: #3A2D12; --clip-ink: #F6DCA4; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.65 var(--body); word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 10px; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-size: 21px; letter-spacing: .01em; }
.mark { width: 20px; height: 32px; border-radius: 5px; background: var(--accent); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 5px; height: 4px; border-radius: 2px; background: var(--clip); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { display: flex; align-items: center; gap: 7px; text-decoration: none; padding: 7px 12px; border-radius: 10px; color: var(--muted); font-weight: 500; }
.nav a b { font-family: var(--mono); font-size: 12px; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.nav a:hover { color: var(--ink); }
.nav a.on { color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.nav a.on b { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.ext { text-decoration: none; font-size: 14px; color: var(--accent); font-weight: 600; padding: 7px 4px; }
@media (max-width: 680px) {
  .nav { order: 3; width: 100%; margin-left: 0; }
  .nav a { flex: 1; justify-content: center; padding: 7px 6px; }
  .ext { margin-left: auto; }
}

.wrap { max-width: 1200px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 32px 64px; }

/* 홈 */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 12px 40px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--accent); margin: 0 0 12px; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 6vw, 68px); line-height: 1.12; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--clip-soft) 62%); }
.lead { font-size: 17px; color: var(--muted); max-width: 46ch; margin: 18px 0 26px; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; font-size: 15px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.demo { display: grid; justify-items: center; gap: 16px; }
.phone { width: min(230px, 62vw); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 26px; border: 8px solid var(--ink); background: var(--sunk); position: relative; overflow: hidden; }
.phone .sky { position: absolute; inset: 0; background:
  radial-gradient(circle at 70% 26%, var(--clip-soft) 0 18%, transparent 19%),
  radial-gradient(ellipse at 30% 40%, var(--surface) 0 16%, transparent 17%),
  radial-gradient(ellipse at 45% 37%, var(--surface) 0 13%, transparent 14%),
  linear-gradient(180deg, var(--accent-soft), var(--sunk) 70%); }
.phone .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: var(--accent); opacity: .55; }
.phone .cap { position: absolute; left: 10px; right: 10px; bottom: 16%; text-align: center; font-weight: 700; font-size: 14px; line-height: 1.4; color: #fff; text-shadow: 0 1px 0 #000, 0 0 4px #000; min-height: 2.8em; display: grid; place-items: end center; }
.phone .tag { position: absolute; top: 10px; left: 10px; font: 500 11px/1 var(--mono); background: var(--surface); color: var(--muted); padding: 5px 7px; border-radius: 6px; }
.strip { width: min(380px, 100%); display: flex; gap: 3px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.strip .c { min-width: 0; display: grid; gap: 4px; }
.strip .c i { display: block; height: 22px; border-radius: 4px; background: var(--clip-soft); border: 1px solid var(--clip); }
.strip .c.on i { background: var(--clip); }
.strip .c span { font: 500 10px/1 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
.demo small { color: var(--muted); font-size: 12px; }

.sec-h { font-family: var(--display); font-weight: 400; font-size: 28px; margin-bottom: 16px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 48px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 8px; align-content: start; }
.step .n { font: 500 12px/1 var(--mono); color: var(--accent); }
.step h3 { font-size: 18px; }
.step p { margin: 0; color: var(--muted); font-size: 14px; }
.step .btn { justify-self: start; margin-top: 6px; }
.step.vrew { background: var(--sunk); border-style: dashed; }
@media (max-width: 960px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .steps { grid-template-columns: minmax(0, 1fr); } }

.where { display: grid; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
.where > div { display: grid; grid-template-columns: 160px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 14px 20px; border-top: 1px solid var(--line); }
.where > div:first-child { border-top: 0; background: var(--sunk); font-size: 13px; color: var(--muted); font-weight: 600; }
.where b { font-weight: 600; }
@media (max-width: 640px) {
  .where > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .where > div:first-child { display: none; }
}

/* 도구 페이지 */
.ph-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.ph-head .eyebrow { margin-bottom: 6px; }
.ph-head h1 { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1.15; }
.ph-head p { margin: 6px 0 0; color: var(--muted); }
.ph-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .tool { grid-template-columns: minmax(0, 1fr); } }

.chat { display: grid; gap: 12px; min-width: 0; }
.msg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.ava { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); flex: none; position: relative; }
.ava::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 7px; height: 3px; border-radius: 2px; background: var(--clip); }
.bubble { padding: 10px 14px; border-radius: 4px 14px 14px 14px; background: var(--surface); border: 1px solid var(--line); max-width: 52ch; min-width: 0; }
.bubble .hint { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.bubble .qn { font: 500 11px/1 var(--mono); color: var(--muted); display: block; margin-bottom: 4px; }
.msg.user { justify-content: flex-end; align-items: center; }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-color: transparent; border-radius: 14px 4px 14px 14px; white-space: pre-line; }
.msg.user .bubble.skip { background: var(--sunk); color: var(--muted); }
.fix { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 6px; flex: none; }
.fix:hover { color: var(--accent); text-decoration: underline; }
.area { margin-left: 40px; background: var(--surface); border: 1.5px dashed var(--clip); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
@media (max-width: 520px) { .area { margin-left: 0; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chip.on::before { content: "✓ "; color: var(--accent); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); margin-right: 6px; vertical-align: -1px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.txt { flex: 1 1 200px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; }
textarea.txt { width: 100%; min-height: 180px; resize: vertical; line-height: 1.6; flex-basis: 100%; }
.txt:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.row .spacer { flex: 1; }
.done .bubble { border-color: var(--accent); }

.out { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); max-height: calc(100vh - 104px); overflow: auto; min-width: 0; }
@media (max-width: 880px) { .out { position: static; max-height: none; } }
.out-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.out-h h2 { font-size: 16px; font-weight: 700; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--clip-soft); color: var(--clip-ink); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
pre.prompt { margin: 0; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; font: 14px/1.75 var(--body); background: var(--sunk); border-radius: 12px; padding: 14px 16px; min-width: 0; }
mark.ph { background: var(--clip-soft); color: var(--clip-ink); border-radius: 4px; padding: 0 5px; font-weight: 600; }
.scenes { display: grid; gap: 10px; }
.scene { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.scene-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.scene-h span { font: 500 12px/1 var(--mono); color: var(--accent); }
.scene pre.prompt { font-size: 13px; padding: 10px 12px; }
.note { margin: 0; font-size: 13px; color: var(--muted); background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.note b { color: var(--ink); }
.next { margin-top: 28px; display: flex; justify-content: flex-end; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.foot { max-width: 1200px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 20px 32px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home"><span class="mark" aria-hidden="true"></span><span>숏폼 프롬프트 공방</span></a>
  <nav class="nav" aria-label="만들기 단계">
    <a href="#char" data-r="char"><b>1</b>캐릭터</a>
    <a href="#script" data-r="script"><b>2</b>대본</a>
    <a href="#scene" data-r="scene"><b>3</b>이미지</a>
  </nav>
  <a class="ext" href="https://vrew.ai/ko/" target="_blank" rel="noopener">브루 열기 ↗</a>
</div></header>
<main id="app"></main>
<footer class="foot">답한 내용은 이 브라우저에만 저장돼요. 다른 사람에게는 보이지 않아요.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const o = (ko, en, label) => ({ ko, en: en === undefined ? ko : en, label: label || ko });
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 저장 ---------- */
const KEY = 'shortform-prompt.v1';
let DATA = {};
try { DATA = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { DATA = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(DATA)); } catch (e) {} }
function S(p) { if (!DATA[p]) DATA[p] = { a: {}, cur: 0 }; return DATA[p]; }

/* 답 꺼내기 */
function V(a, id, lang) {
  const x = a[id];
  if (!x || x.skip || x.none) return '';
  if (Array.isArray(x)) return x.map(i => i[lang]).filter(Boolean).join(', ');
  return x[lang] || '';
}
const ph = t => '⟦' + t + '⟧';
/* 받침에 따라 을/를 */
const eul = w => { const c = String(w).trim().slice(-1).charCodeAt(0); return (c >= 0xAC00 && c <= 0xD7A3) ? ((c - 0xAC00) % 28 ? '을' : '를') : '을(를)'; };
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* ---------- 공통 선택지 ---------- */
/* 그림체별 세부 규칙: Style(영어) · 그림체 · 비율 · 선 · 채색·명암 · 디테일·질감 · 조명 · 색감 · 피할 것 */
const S_ = (name, en, desc, body, line, shade, detail, light, color, avoid) => ({ name, en, desc, body, line, shade, detail, light, color, avoid });
const STYLE_DEFS = [
  S_('3D 애니메이션', '3D animated feature film style, stylized proportions, soft subsurface skin, smooth rounded shapes, gentle global illumination, rich soft colors',
    '극장용 3D 애니메이션 영화 속 캐릭터', '머리가 조금 큰 4~5등신, 둥글고 부드러운 몸', '외곽선 없이 형태와 명암으로 구분', '부드러운 그라데이션 명암, 은은한 반사광',
    '머리카락은 큰 덩어리로 정리, 옷 주름은 단순하고 부드럽게', '따뜻한 햇빛과 부드러운 그림자', '채도가 적당한 따뜻한 색', '2D 선화, 실사 피부, 거친 질감, 무서운 표정'),
  S_('2D 웹툰', 'Korean webtoon style digital illustration, clean crisp line art, flat cel shading with one shadow tone, bright clean colors',
    '한국 웹툰 같은 깔끔한 2D 일러스트', '자연스러운 비율 (어린이는 4~5등신)', '일정한 두께의 깔끔하고 또렷한 선', '평평한 바탕색과 1단계 그림자',
    '머리카락은 선으로 결을 살리되 단순하게', '밝고 고른 조명', '깨끗하고 밝은 색', '3D 렌더, 수채 번짐, 거친 붓질, 과한 그라데이션'),
  S_('3D 치비', '3D chibi figure, 2 to 3 heads tall, oversized head, big glossy eyes, soft vinyl toy material, smooth rounded shapes, bright studio lighting',
    '장난감 피규어 같은 2~3등신 3D 치비', '머리가 몸만큼 큰 2~3등신, 짧고 통통한 팔다리', '외곽선 없음', '매끈한 장난감 광택과 부드러운 그림자',
    '머리카락과 옷은 큼직하고 단순한 덩어리', '위에서 비추는 밝은 스튜디오 조명', '파스텔에 가까운 밝은 색', '2D 선화, 실제 사람 비율, 복잡한 옷 주름, 거친 질감'),
  S_('2D 치비', '2D chibi sticker illustration, 2 to 3 heads tall, very large shiny eyes, thick soft rounded outlines, flat cel shading, blush on cheeks, bright cute colors',
    '스티커 같은 2~3등신 2D 치비', '머리가 몸만큼 큰 2~3등신, 짧은 팔다리', '굵고 둥글고 부드러운 외곽선', '1단계 셀 그림자, 볼 홍조',

function sentences(text) {
  return String(text || '').split(/\n+/)
    .flatMap(l => l.trim().split(/(?<=[.!?…])\s+/))
    .map(s => s.replace(/^\s*(\d+[.)]|[-•*])\s*/, '').trim())
    .filter(Boolean);
}
function sceneCommon(a) {
  const st = styleOf(a);
  const nochar = !!(a.who && a.who.nochar);
  return { st, nochar, name: st ? st.name : ph('그림체'), who: V(a, 'who', 'ko') || (nochar ? '' : ph('등장인물')) };
}
/* 브루 '비디오 꾸미기 → AI 이미지 → 이미지 프롬프트' 칸: 모든 장면에 한 번에 적용되는 짧은 설명 */
function buildVrew(a) {
  const c = sceneCommon(a), d = c.st && c.st.d;
  const styleTxt = !c.st ? ph('그림체') : d ? `${d.name} (${d.en})` : c.st.name;
  const cc = a.who && a.who.fromChar ? V(S('char').a, 'color', 'ko') : '';
  const colors = [V(a, 'mood', 'ko'), cc ? `포인트 컬러 ${cc}` : ''].filter(Boolean);
  const L = [`그림체: ${styleTxt}.`];
  if (c.nochar) L.push('사람이나 캐릭터 없이 풍경과 사물 위주로 그려 줘.');
  else if (a.who && a.who.ref) L.push('주인공: 참고 이미지에 있는 캐릭터. 얼굴·머리 모양·옷·색을 참고 이미지와 똑같이 지키고, 모든 장면에서 같은 모습으로 그려 줘. 참고 이미지 속 배경은 따라 하지 말고 장면마다 대본에 맞는 배경으로 그려 줘.');
  else L.push(`주인공: ${c.who}. 모든 장면에서 같은 얼굴·머리·옷으로 그려 줘.`);
  if (colors.length) L.push(`색감: ${colors.join(', ')}.`);
  L.push(`피할 것: ${d ? d.avoid + ', ' : ''}이미지 안의 글자·자막·말풍선.`);
  return L.join('\n');
}

let route = null, pending = null, resetArm = false, OUTCACHE = [];
const getOpts = q => typeof q.options === 'function' ? q.options() : (q.options || []);
function firstOpen(p, from) {
  const Q = PAGES[p].Q(), a = S(p).a;
  for (let i = from; i < Q.length; i++) if (a[Q[i].id] === undefined) return i;
  for (let i = 0; i < Math.min(from, Q.length); i++) if (a[Q[i].id] === undefined) return i;
  return Q.length;
}
function labelOf(q, x) {
  if (!x) return '';
  if (x.skip) return '건너뛰었어요';
  if (Array.isArray(x)) return x.length ? x.map(i => i.label || i.ko).join(', ') : '없음';
  if (q.type === 'longtext') {
    const ss = sentences(x.ko);
    const first = ss.slice(0, 2).join('\n');
    return first + (ss.length > 2 ? `\n… 모두 ${ss.length}문장` : '');
  }
  return x.label || x.ko;
}

    <div class="steps">
      <div class="step"><span class="n">STEP 1</span><h3>캐릭터 프롬프트</h3><p>누구인지, 무엇을 입고 어떤 그림체인지 고르면 기본 그림과 캐릭터 시트 프롬프트가 나와요.</p><a class="btn sm" href="#char">만들기</a></div>
      <div class="step"><span class="n">STEP 2</span><h3>대본 프롬프트</h3><p>영상 종류, 주제, 보는 사람, 길이를 답하면 브루에 맞춘 대본 요청문이 나와요.</p><a class="btn sm" href="#script">만들기</a></div>
      <div class="step"><span class="n">STEP 3</span><h3>이미지 프롬프트</h3><p>브루 ‘비디오 꾸미기’의 이미지 프롬프트 칸에 넣을 그림체·주인공·색감 설명을 만들어요.</p><a class="btn sm" href="#scene">만들기</a></div>
      <div class="step vrew"><span class="n">STEP 4</span><h3>브루에서 영상 완성</h3><p>대본과 이미지 프롬프트를 넣고, AI 목소리와 배경음악을 골라 숏폼을 완성해요.</p><a class="btn sm" href="https://vrew.ai/ko/" target="_blank" rel="noopener">브루 열기 ↗</a></div>
    </div>

    <h2 class="sec-h">만든 프롬프트는 어디에 붙여 넣나요?</h2>
    <div class="where">
      <div><span>프롬프트</span><span>붙여 넣을 곳</span><span>받은 결과로 할 일</span></div>
      <div><b>캐릭터 그림</b><span>ChatGPT, Gemini, Canva 등 이미지 생성 AI</span><span>그림을 저장해 두고, 장면 그림을 만들 때 함께 올려요</span></div>
      <div><b>대본 요청</b><span>ChatGPT, Gemini, Claude 등 대화형 AI</span><span>받은 대본을 브루 ‘텍스트로 비디오 만들기’에 붙여 넣어요</span></div>
      <div><b>이미지 프롬프트</b><span>브루 비디오 꾸미기 → AI 이미지 → 이미지 프롬프트 칸</span><span>기준 캐릭터 그림을 ‘참고 이미지’로 올리고 만들기를 눌러요</span></div>
    </div>
  </div>`;
  if (!reduce) {
    let i = 0;
    clearInterval(renderHome.timer);
    renderHome.timer = setInterval(() => {
      const cap = $('#demoCap'), strip = $('#demoStrip');
      if (!cap || !strip) { clearInterval(renderHome.timer); return; }
      i = (i + 1) % lines.length;
      cap.textContent = lines[i];
      [...strip.children].forEach((c, k) => c.classList.toggle('on', k === i));
    }, 2200);
  }
}

/* ---------- 도구 페이지 ---------- */
function renderTool(p) {
  const P = PAGES[p];
  const nx = P.next;
  $('#app').innerHTML = `
  <div class="wrap">
    <div class="ph-head">
      <div><p class="eyebrow">STEP ${P.step} / 3</p><h1>${P.title}</h1><p>${P.desc}</p></div>
      <div class="ph-tools">
        <button class="btn sm" data-act="example">예시로 채우기</button>
        <button class="btn sm" data-act="reset" id="resetBtn">처음부터</button>
      </div>
    </div>
    <div class="tool">
      <section class="chat" id="chat" aria-label="질문"></section>
      <aside class="out" id="out" aria-label="완성된 프롬프트"></aside>
    </div>
    <div class="next"><a class="btn primary" href="${nx.href}"${nx.ext ? ' target="_blank" rel="noopener"' : ''}>${nx.label}</a></div>
  </div>`;
  updateChat(p);
  updateOut(p);
}

function updateChat(p) {
  const P = PAGES[p], st = S(p), Q = P.Q();
  if (st.cur > Q.length) st.cur = firstOpen(p, 0);
  let h = `<div class="msg bot"><span class="ava" aria-hidden="true"></span><div class="bubble">${P.intro}</div></div>`;
  Q.forEach((q, i) => {
    const ans = st.a[q.id];
    const bot = `<div class="msg bot"><span class="ava" aria-hidden="true"></span><div class="bubble"><span class="qn">${i + 1} / ${Q.length}</span>${esc(q.ask)}${q.hint ? `<span class="hint">${esc(q.hint)}</span>` : ''}</div></div>`;
    if (i === st.cur) h += bot + area(p, q);
    else if (ans !== undefined) h += bot + `<div class="msg user"><button class="fix" data-act="edit" data-i="${i}">고치기</button><div class="bubble${ans.skip ? ' skip' : ''}">${esc(labelOf(q, ans))}</div></div>`;
  });
  if (st.cur >= Q.length) {
    h += `<div class="msg bot done" id="area"><span class="ava" aria-hidden="true"></span><div class="bubble">다 됐어요! 프롬프트를 복사해서 AI에 붙여 넣으세요. 답을 바꾸고 싶으면 ‘고치기’를 누르면 돼요.</div></div>`;
  }
  $('#chat').innerHTML = h;
}

function area(p, q) {
  const st = S(p), cur = st.a[q.id];
  let h = '<div class="area" id="area">';
  if (q.type === 'single' || q.type === 'multi') {
    const opts = getOpts(q);
    if (q.type === 'multi' && (!pending || pending.q !== q.id)) pending = { q: q.id, list: Array.isArray(cur) ? cur.slice() : [] };
    const sel = q.type === 'multi' ? pending.list : [];
    h += '<div class="chips">' + opts.map((op, i) => {
      const on = q.type === 'multi' ? sel.some(s => s.ko === op.ko && s.en === op.en)
        : !!(cur && !Array.isArray(cur) && !cur.skip && cur.ko === op.ko && (cur.label || cur.ko) === (op.label || op.ko));
      return `<button class="chip${on ? ' on' : ''}" data-act="${q.type === 'multi' ? 'toggle' : 'pick'}" data-i="${i}" aria-pressed="${on}">${op.sw ? `<i class="sw" style="background:${op.sw}"></i>` : ''}${esc(op.label || op.ko)}</button>`;
    }).join('');
    if (q.type === 'multi') sel.forEach((s, i) => { if (s.custom) h += `<button class="chip on" data-act="unadd" data-i="${i}" aria-pressed="true" title="눌러서 빼기">${esc(s.ko)}</button>`; });
    h += '</div>';
  }
  if (q.custom || q.type === 'text') {
    const val = (q.type === 'text' && cur && !cur.skip) ? cur.ko : '';
    h += `<div class="row"><input class="txt" id="cin" type="text" autocomplete="off" placeholder="${esc(q.placeholder || q.custom)}" value="${esc(val)}"><button class="btn sm" data-act="custom">${q.type === 'multi' ? '더하기' : '입력'}</button></div>`;
  }
  if (q.type === 'longtext') {
    const val = cur && !cur.skip ? cur.ko : '';
    h += `<textarea class="txt" id="cin" placeholder="${esc(q.placeholder)}">${esc(val)}</textarea>`;
  }
  const btns = [];
  if (q.type === 'longtext') btns.push(`<button class="btn sm" data-act="sample">예시 대본 넣기</button>`, '<span class="spacer"></span>', `<button class="btn sm primary" data-act="custom">다음</button>`);
  if (q.type === 'multi') btns.push('<span class="spacer"></span>', `<button class="btn sm primary" data-act="multi">${pending.list.length ? `${pending.list.length}개 고르고 다음` : '다음'}</button>`);
  if (q.optional) btns.splice(q.type === 'multi' ? 1 : 0, 0, `<button class="btn sm" data-act="skip">건너뛰기</button>`);
  if (btns.length) h += `<div class="row">${btns.join('')}</div>`;
  return h + '</div>';
}

function updateOut(p) {
  const P = PAGES[p], st = S(p);
  const lang = P.langs.includes(st.lang) ? st.lang : P.langs[0];
  const tab = P.outs.some(x => x.id === st.tab) ? st.tab : P.outs[0].id;
  const out = P.outs.find(x => x.id === tab);
  const res = out.build(st.a, lang);
  const items = Array.isArray(res) ? res : [{ title: '', text: res }];
  OUTCACHE = items.map(x => x.text);
  const missing = (OUTCACHE.join('').match(/⟦/g) || []).length;
  const mark = t => esc(t).replace(/⟦(.+?)⟧/g, '<mark class="ph">$1</mark>');
  let h = `<div class="out-h"><h2>완성된 프롬프트</h2>${missing ? `<span class="pill">빈칸 ${missing}개</span>` : '<span class="pill ok">완성</span>'}</div>`;
  h += '<div class="bar">';
  h += P.outs.length > 1 ? `<div class="seg" role="tablist">${P.outs.map(x => `<button role="tab" aria-selected="${x.id === tab}" class="${x.id === tab ? 'on' : ''}" data-act="tab" data-v="${x.id}">${x.label}</button>`).join('')}</div>` : '<span></span>';
  if (P.langs.length > 1) h += `<div class="seg" aria-label="언어">${P.langs.map(l => `<button class="${l === lang ? 'on' : ''}" aria-pressed="${l === lang}" data-act="lang" data-v="${l}">${l === 'ko' ? '한국어' : 'English'}</button>`).join('')}</div>`;
  h += '</div>';
  if (Array.isArray(res)) {
    h += `<div class="row"><span class="spacer"></span><button class="btn sm primary" data-act="copyall">장면 ${items.length}개 모두 복사</button></div><div class="scenes">`;
    h += items.map((x, i) => `<div class="scene"><div class="scene-h"><span>${esc(x.title)}</span><button class="btn sm" data-act="copy" data-i="${i}">복사</button></div><pre class="prompt" id="pr${i}">${mark(x.text)}</pre></div>`).join('');
    h += '</div>';
  } else {
    h += `<pre class="prompt" id="pr0">${mark(res)}</pre><div class="row"><span class="spacer"></span><button class="btn primary" data-act="copy" data-i="0">프롬프트 복사</button></div>`;
  }
  if (out.count && !Array.isArray(res)) h += `<p class="note">글자 수 <b>${res.replace(/[⟦⟧]/g, '').length}자</b> · 칸에 다 안 들어가면 ‘피할 것’ 줄을 먼저 빼 보세요.</p>`;
  h += `<p class="note">${out.where || P.where}</p>`;
  $('#out').innerHTML = h;
}

/* ---------- 동작 ---------- */
function answer(p, val) {
  const st = S(p), q = PAGES[p].Q()[st.cur];
  if (!q) return;
  st.a[q.id] = val;
  st.cur = firstOpen(p, st.cur + 1);
  pending = null;
  save();
  updateChat(p); updateOut(p); focusArea();
}
function focusArea() {
  const el = $('#area');
  if (!el) return;
  el.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  const inp = $('#cin', el);
  if (inp && (inp.tagName === 'TEXTAREA' || !$('.chips', el))) inp.focus({ preventScroll: true });
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function copy(text, el) {
  const clean = text.replace(/⟦(.+?)⟧/g, '[$1]');
  const left = (text.match(/⟦/g) || []).length;
  const ok = () => toast(left ? `복사했어요. 아직 빈칸이 ${left}개 있어요.` : '복사했어요. AI 입력창에 붙여 넣으세요.');
  const fail = () => {
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('자동 복사가 막혀 있어요. 선택된 글자를 Ctrl+C로 복사하세요.');
  };
  try { navigator.clipboard.writeText(clean).then(ok, fail); } catch (e) { fail(); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !PAGES[route]) return;
  const p = route, st = S(p), Q = PAGES[p].Q(), q = Q[st.cur], act = b.dataset.act;
  if (act !== 'reset' && resetArm) { resetArm = false; const rb = $('#resetBtn'); if (rb) rb.textContent = '처음부터'; }
  if (act === 'pick') answer(p, getOpts(q)[+b.dataset.i]);
  else if (act === 'toggle') {
    const op = getOpts(q)[+b.dataset.i];
    const k = pending.list.findIndex(s => s.ko === op.ko && s.en === op.en);
    if (k >= 0) pending.list.splice(k, 1); else pending.list.push(op);
    updateChat(p);
  }
  else if (act === 'unadd') { pending.list.splice(+b.dataset.i, 1); updateChat(p); }
  else if (act === 'multi') answer(p, pending.list.slice());
  else if (act === 'custom') submitCustom(p);
  else if (act === 'skip') answer(p, { skip: true });
  else if (act === 'sample') { const t = $('#cin'); if (t) { t.value = SAMPLE_SCRIPT; t.focus(); } }
  else if (act === 'edit') { st.cur = +b.dataset.i; pending = null; save(); updateChat(p); focusArea(); }
  else if (act === 'tab') { st.tab = b.dataset.v; save(); updateOut(p); }
  else if (act === 'lang') { st.lang = b.dataset.v; save(); updateOut(p); }
  else if (act === 'copy') copy(OUTCACHE[+b.dataset.i] || '', $('#pr' + b.dataset.i));
  else if (act === 'copyall') copy(OUTCACHE.map((t, i) => `[${i + 1}]\n${t}`).join('\n\n'), null);
  else if (act === 'example') {
    st.a = PAGES[p].example(); st.cur = Q.length; pending = null; save();
    updateChat(p); updateOut(p); toast('예시 답을 채웠어요. ‘고치기’로 하나씩 바꿔 보세요.');
  }
  else if (act === 'reset') {
    if (!resetArm) { resetArm = true; b.textContent = '한 번 더 누르면 지워져요'; return; }
    resetArm = false; DATA[p] = { a: {}, cur: 0, lang: st.lang, tab: st.tab }; pending = null; save();
    b.textContent = '처음부터'; updateChat(p); updateOut(p); toast('이 단계의 답을 모두 지웠어요.');
  }
});
function submitCustom(p) {
  const st = S(p), q = PAGES[p].Q()[st.cur], inp = $('#cin');
  if (!q || !inp) return;
  const v = inp.value.trim();
  if (!v) { inp.focus(); toast(q.type === 'longtext' ? '대본을 먼저 붙여 넣어 주세요.' : '내용을 입력해 주세요.'); return; }
  if (q.type === 'multi') {
    pending.list.push({ ko: v, en: v, label: v, custom: true });
    updateChat(p); const n = $('#cin'); if (n) n.focus();
    return;
  }
  answer(p, { ko: v, en: v, label: v });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'cin' && e.target.tagName === 'INPUT' && !e.isComposing) { e.preventDefault(); submitCustom(route); }
});

/* ---------- 라우팅 ---------- */
function go() {
  const h = location.hash.slice(1);
  const r = PAGES[h] ? h : 'home';
  if (r === route) return;
  route = r; pending = null; resetArm = false;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  if (r === 'home') { renderHome(); document.title = '숏폼 프롬프트 공방'; }
  else { renderTool(r); document.title = PAGES[r].title + ' · 숏폼 프롬프트 공방'; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', go);
go();
})();
</script>
